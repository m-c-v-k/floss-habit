name: Build

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Until the Android app module exists, only the pure-Kotlin modules are built and tested.
      - name: Build, unit test and lint
        run: |
          if [ ! -f gradlew ]; then
            echo "::notice::No Gradle project yet; nothing to build."
          elif [ -f app/build.gradle.kts ]; then
            ./gradlew assembleDevDebug testDevDebugUnitTest lintDevDebug assembleProdDebug :core:test --stacktrace
          else
            ./gradlew test --stacktrace
          fi

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "**/build/reports/"
