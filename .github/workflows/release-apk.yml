name: Publish APK

# Every push to dev or main builds a signed release APK and publishes it as a
# rolling GitHub Release: "dev-latest" (pre-release) for dev, "prod-latest" for main.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for app module
        id: app
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Android app module yet; no APK to publish."
          fi

      - uses: actions/setup-java@v4
        if: steps.app.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.app.outputs.exists == 'true'

      - name: Pick flavour
        id: env
        if: steps.app.outputs.exists == 'true'
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "flavour=prod" >> "$GITHUB_OUTPUT"
            echo "task=assembleProdRelease" >> "$GITHUB_OUTPUT"
            echo "tag=prod-latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "flavour=dev" >> "$GITHUB_OUTPUT"
            echo "task=assembleDevRelease" >> "$GITHUB_OUTPUT"
            echo "tag=dev-latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode signing key
        if: steps.app.outputs.exists == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; APK is signed with a throwaway debug key and will not update over a previous install."
          fi

      - name: Build APK
        if: steps.app.outputs.exists == 'true'
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew ${{ steps.env.outputs.task }} --stacktrace

      - name: Publish release
        if: steps.app.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.env.outputs.tag }}
          FLAVOUR: ${{ steps.env.outputs.flavour }}
          PRERELEASE: ${{ steps.env.outputs.prerelease }}
        run: |
          apk=$(ls app/build/outputs/apk/${FLAVOUR}/release/*.apk | head -n 1)
          short=$(git rev-parse --short HEAD)
          name="floss-habit-${FLAVOUR}-${GITHUB_RUN_NUMBER}-${short}.apk"
          cp "$apk" "$name"
          gh release delete "$TAG" --cleanup-tag --yes || true
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; else flags="--latest"; fi
          gh release create "$TAG" "$name" $flags \
            --target "$GITHUB_SHA" \
            --title "${FLAVOUR} build ${GITHUB_RUN_NUMBER} (${short})" \
            --notes "Automatic ${FLAVOUR} build from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. Install the APK on your phone (allow installs from unknown sources)."
